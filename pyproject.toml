[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-hour-rash"
version = "1.0.0"
description = "A motorcycle combat racer: five roads, five modes, and a sunrise at the end of one of them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5,<3",
    "numpy>=1.24,<3",
]

[project.scripts]
golden-hour-rash = "goldenhour.app:main"

[project.urls]
Source = "https://github.com/Shubham080802/golden-hour-rash"

[tool.setuptools]
packages = ["goldenhour"]
